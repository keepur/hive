# Dependabot version updates (KPR-366 follow-through, enabled 2026-07-26).
# Security alerts + security-fix PRs are enabled at the repo level; this file
# adds a weekly scheduled pass for regular version drift.
#
# All Dependabot PRs target main and are human-merged (Gate 2 discipline —
# automation never merges into main).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    # One grouped PR for all semver-minor/patch drift; majors arrive as
    # individual PRs so each 0.x runtime-SDK bump stays a considered,
    # separately-reviewable change (see KPR-366).
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @qdrant/js-client-rest 1.19 removed QdrantClient.search() (migrated to
      # query() in this repo) AND warns as incompatible against our deployed
      # Qdrant *server* 1.17 — the client tolerates at most a 1-minor gap.
      # Hold at 1.18 until the fleet's Qdrant servers are upgraded, then drop
      # this entry; the code is already off the removed API, so the bump is
      # then a one-line version change.
      - dependency-name: "@qdrant/js-client-rest"
        versions: [">=1.19.0"]
      # npm's xlsx line is abandoned upstream; we pin the SheetJS vendor CDN
      # tarball instead (PR #339). Dependabot must not "update" it back.
      - dependency-name: "xlsx"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
