name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          architecture: arm64
          registry-url: "https://registry.npmjs.org"

      - name: Verify selected Node major
        env:
          EXPECTED_NODE_MAJOR: "22"
        run: |
          set -euo pipefail
          major="$(node -p 'process.versions.node.split(".")[0]')"
          echo "node=$(node -v) npm=$(npm --version) os=$(uname -srm)"
          if [ "$major" != "$EXPECTED_NODE_MAJOR" ]; then
            echo "actions/setup-node did not select Node $EXPECTED_NODE_MAJOR (got $(node -v)); ambient runner Node is not acceptable" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run checks
        env:
          SLACK_APP_TOKEN: xapp-test-placeholder
          SLACK_BOT_TOKEN: xoxb-test-placeholder
        run: npm run check

      - name: Bundle and packed-artifact checks
        run: npm run check:bundle

      - name: Pack release
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/hive-release"
          node scripts/generate-shrinkwrap.mjs --pack --json --pack-destination "$RUNNER_TEMP/hive-release" | tee "$RUNNER_TEMP/hive-pack.json"
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");
            const parsed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/hive-pack.json", "utf8"));
            const info = Array.isArray(parsed) ? parsed[0] : Object.values(parsed)[0];
            if (!info?.filename) throw new Error("pack json missing filename");
            const archive = path.join(process.env.RUNNER_TEMP, "hive-release", info.filename);
            if (!fs.existsSync(archive)) throw new Error("packed archive missing: " + archive);
            const digest = crypto.createHash("sha256").update(fs.readFileSync(archive)).digest("hex");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "archive=" + archive + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "digest=" + digest + "\n");
            console.log("Packed " + archive + " sha256=" + digest);
          '

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.archive }}" --access public
